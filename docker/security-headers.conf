# سربرگ‌های امنیتی مشترک.
#
# چرا فایل جداست: در nginx هر `add_header` داخل یک بلوک `location`،
# **همهٔ** سربرگ‌های ارث‌برده از بلوک بالاتر را دور می‌ریزد. پس هر location
# که Cache-Control خودش را می‌گذارد، باید این‌ها را هم دوباره include کند —
# وگرنه بی‌صدا بدون CSP سرو می‌شود.

add_header X-Content-Type-Options "nosniff"                       always;
add_header X-Frame-Options        "SAMEORIGIN"                    always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# سیاست امنیتی محتوا — دقیقاً همان میزبان‌هایی که اپ واقعاً صدا می‌زند.
# اگر سرویس بیرونی جدیدی اضافه شد باید این‌جا هم اضافه شود، وگرنه مرورگر
# بی‌صدا بلوکش می‌کند.
#   connect-src  → هواشناسی، بایگانی هواشناسی، مسیریابی، کشف جاذبه
#   img-src blob: → عکس‌های دفترچهٔ سفر که از IndexedDB با createObjectURL می‌آیند
#   img-src https://tile.openstreetmap.org → کاشی‌های نقشه
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://api.open-meteo.com https://archive-api.open-meteo.com https://router.project-osrm.org https://overpass-api.de; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
