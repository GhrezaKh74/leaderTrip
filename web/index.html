<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="دستیار لیدر سفر: برنامهٔ ساعت‌به‌ساعت و تخمین هزینهٔ قابل ردیابی" />
    <meta name="theme-color" content="#0c7d84" />
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="لیدرتریپ" />
    <title>لیدرتریپ</title>
    <style>
      /* ── اسپلش — پیش از بارشدن جاوااسکریپت دیده می‌شود، پس همین‌جا زندگی
         می‌کند و به هیچ باندلی وابسته نیست. با آماده‌شدن React محو می‌شود. ── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(120% 90% at 85% -10%, rgba(77, 182, 188, 0.35) 0%, rgba(77, 182, 188, 0) 55%),
          radial-gradient(120% 100% at 10% 110%, rgba(217, 138, 36, 0.28) 0%, rgba(217, 138, 36, 0) 50%),
          linear-gradient(160deg, #142c55 0%, #1d3f77 45%, #0c7d84 100%);
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash img {
        width: clamp(96px, 30vw, 148px);
        height: auto;
        border-radius: 24%;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        animation: splash-pop 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      #splash .name {
        color: #fff;
        font: 800 clamp(26px, 7vw, 34px) / 1.3 'IRANSans', Vazirmatn, system-ui, sans-serif;
        letter-spacing: 0.5px;
        animation: splash-rise 0.6s 0.25s ease-out both;
      }
      #splash .tag {
        color: rgba(255, 255, 255, 0.75);
        font: 400 clamp(13px, 3.6vw, 15px) / 1.6 'IRANSans', Vazirmatn, system-ui, sans-serif;
        animation: splash-rise 0.6s 0.4s ease-out both;
      }
      /* جادهٔ نقطه‌چینی که «می‌راند» — قصهٔ خود اپ */
      #splash .road {
        width: min(220px, 55vw);
        height: 4px;
        border-radius: 2px;
        margin-top: 6px;
        background-image: linear-gradient(90deg, rgba(255, 255, 255, 0.85) 0 14px, transparent 14px 26px);
        background-size: 26px 4px;
        animation: splash-drive 0.9s linear infinite;
        opacity: 0.8;
      }
      @keyframes splash-pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splash-rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes splash-drive { to { background-position-x: -26px; } }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .name, #splash .tag { animation: none; }
        #splash .road { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="در حال بارگذاری لیدرتریپ">
      <img src="/icons/icon-192.png" alt="" />
      <div class="name">لیدرتریپ</div>
      <div class="tag">دستیار لیدر سفر — برنامهٔ ساعت‌به‌ساعت، هزینهٔ قابل‌ردیابی</div>
      <div class="road"></div>
    </div>
    <div id="root"></div>
    <script>
      // اپ که آماده شد این رویداد را می‌فرستد؛ اگر هم هرگز نیامد (خطای بارگذاری)،
      // اسپلش خودش کنار می‌رود تا پیام خطا پنهان نماند.
      (function () {
        var splash = document.getElementById('splash')
        var hide = function () {
          splash.classList.add('done')
          setTimeout(function () { splash.remove() }, 600)
        }
        window.addEventListener('leadertrip:ready', hide, { once: true })
        setTimeout(hide, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
