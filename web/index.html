<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="دستیار لیدر سفر: برنامهٔ ساعت‌به‌ساعت و تخمین هزینهٔ قابل ردیابی" />
    <meta name="theme-color" content="#0c7d84" />
    <!-- آیکون svg داخل سورس است و در بیلد هش می‌خورد؛ Vite این مسیر را هنگام
         بیلد به /assets/app-icon-XXXX.svg بازنویسی می‌کند. -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/app-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="لیدرتریپ" />
    <title>لیدرتریپ</title>
    <!-- تصمیم نمایش اسپلش + پس‌زمینهٔ تیره؛ پیش از رندر body، پس بدون
         defer/async. عمداً فایل جداست نه درون‌خطی: اسکریپت درون‌خطی را CSP
         (`script-src 'self'`) بی‌صدا بلوک می‌کند و اسپلش تا ابد می‌ماند. -->
    <script src="/boot.js"></script>
    <style>
      .no-splash #splash { display: none; }
      /* ── اسپلش — پیش از بارشدن جاوااسکریپت دیده می‌شود، پس همین‌جا زندگی
         می‌کند و به هیچ باندلی وابسته نیست. با آماده‌شدن React محو می‌شود. ── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(120% 90% at 85% -10%, rgba(77, 182, 188, 0.35) 0%, rgba(77, 182, 188, 0) 55%),
          radial-gradient(120% 100% at 10% 110%, rgba(217, 138, 36, 0.28) 0%, rgba(217, 138, 36, 0) 50%),
          linear-gradient(160deg, #142c55 0%, #1d3f77 45%, #0c7d84 100%);
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      #splash.done { opacity: 0; visibility: hidden; }
      /* ── تور ایمنی، بدون هیچ جاوااسکریپتی ──
         روکشی که تمام صفحه را می‌گیرد نباید بقایش به بارشدنِ یک فایل بند
         باشد. دو بار همین اتفاق افتاد — یک‌بار CSP اسکریپت درون‌خطی را بلوک
         کرد، یک‌بار آفلاین فایل بیرونی را ۴۰۴ کرد — و هر دو بار اسپلش روی
         اپِ سالم قفل شد. این انیمیشن به هیچ اسکریپتی وابسته نیست: اگر تا
         ۸ ثانیه کسی اسپلش را نبسته باشد، خودش کنار می‌رود و مهم‌تر از آن
         `pointer-events` را رها می‌کند تا حتی اگر دیده شد، جلوی کلیک را
         نگیرد. `both` یعنی حالت پایانی می‌ماند و برنمی‌گردد. */
      #splash { animation: splash-timeout 0.5s ease 8s both; }
      @keyframes splash-timeout {
        to { opacity: 0; visibility: hidden; pointer-events: none; }
      }
      #splash img {
        width: clamp(96px, 30vw, 148px);
        height: auto;
        border-radius: 24%;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        animation: splash-pop 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      #splash .name {
        color: #fff;
        font: 800 clamp(26px, 7vw, 34px) / 1.3 'IRANSans', Vazirmatn, system-ui, sans-serif;
        letter-spacing: 0.5px;
        animation: splash-rise 0.6s 0.25s ease-out both;
      }
      #splash .tag {
        color: rgba(255, 255, 255, 0.75);
        font: 400 clamp(13px, 3.6vw, 15px) / 1.6 'IRANSans', Vazirmatn, system-ui, sans-serif;
        animation: splash-rise 0.6s 0.4s ease-out both;
      }
      /* جادهٔ نقطه‌چینی که «می‌راند» — قصهٔ خود اپ */
      #splash .road {
        width: min(220px, 55vw);
        height: 4px;
        border-radius: 2px;
        margin-top: 6px;
        background-image: linear-gradient(90deg, rgba(255, 255, 255, 0.85) 0 14px, transparent 14px 26px);
        background-size: 26px 4px;
        animation: splash-drive 0.9s linear infinite;
        opacity: 0.8;
      }
      /* دکمهٔ ردشدن — کنترل دست کاربر است، حتی وقتی شبکه کند است */
      #splash .skip {
        position: absolute;
        bottom: max(28px, env(safe-area-inset-bottom));
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.45);
        color: rgba(255, 255, 255, 0.9);
        border-radius: 999px;
        padding: 8px 26px;
        font: 600 14px / 1.6 'IRANSans', Vazirmatn, system-ui, sans-serif;
        cursor: pointer;
        animation: splash-rise 0.6s 0.6s ease-out both;
      }
      #splash .skip:active { transform: translateY(1px); }
      @keyframes splash-pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splash-rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes splash-drive { to { background-position-x: -26px; } }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .name, #splash .tag { animation: none; }
        #splash .road { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="در حال بارگذاری لیدرتریپ">
      <img src="/src/assets/app-icon.svg" alt="" />
      <div class="name">لیدرتریپ</div>
      <div class="tag">دستیار لیدر سفر — برنامهٔ ساعت‌به‌ساعت، هزینهٔ قابل‌ردیابی</div>
      <div class="road"></div>
      <button type="button" class="skip">رد شدن</button>
    </div>
    <div id="root"></div>
    <!-- بستن اسپلش (رویداد آمادگی، دکمهٔ ردشدن، و مهلت ۸ ثانیه‌ای). مثل
         boot.js فایل جداست تا CSP بلوکش نکند. -->
    <script src="/splash.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
