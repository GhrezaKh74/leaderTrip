server {
    # پورت بالای ۱۰۲۴ چون کانتینر با کاربر غیر root اجرا می‌شود و
    # پروسهٔ غیر root نمی‌تواند به پورت‌های زیر ۱۰۲۴ گوش بدهد
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset       utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # mime.types این نسخهٔ nginx پسوند mjs را نمی‌شناسد و ماژول ES با
    # octet-stream + nosniff توسط مرورگر رد می‌شود (افزونهٔ RTL نقشه mjs است).
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        application/manifest+json             webmanifest;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff2                            woff2;
        application/x-protobuf                pbf;
        text/plain                            txt;
    }

    # ── فشرده‌سازی ───────────────────────────────────────────────
    # فونت‌های woff2 عمداً نیستند: خودشان فشرده‌اند و دوباره فشرده‌کردنشان
    # فقط CPU مصرف می‌کند
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/javascript application/json
                    application/manifest+json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # ── API — همان مبدأ ─────────────────────────────────────────
    # مرورگر همه‌چیز را از یک مبدأ می‌بیند (همان معماری پروکسی توسعه):
    # CORS بسته می‌ماند، توکن‌ها فقط به مبدأ خودی می‌روند، و PWA آفلاین
    # هم مسیر ثابتی برای کش دارد.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # آپلود عکس چک‌این تا سقف ۵ مگابایت است؛ پیش‌فرضِ ۱ مگابایتی nginx
        # آن را قبل از رسیدن به بک‌اند با 413 می‌کشت.
        client_max_body_size 6m;

        # ساخت برنامه با مسیریابی واقعی می‌تواند چند ده ثانیه طول بکشد.
        proxy_read_timeout 90s;
    }

    # ── کاشی‌های نقشهٔ خودمیزبان ─────────────────────────────────
    # iran.pmtiles و فونت/اسپرایتش از volume می‌آیند (maps/README.md).
    # nginx خودش درخواست Range را جواب می‌دهد — PMTiles دقیقاً همین را
    # می‌خواهد و هیچ سرویس کاشی جدایی لازم نیست. اگر volume خالی باشد،
    # 404 می‌آید و اپ خودش به OSM آنلاین برمی‌گردد.
    location /tiles/ {
        alias /tiles/;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # ── سرویس‌ورکر ───────────────────────────────────────────────
    # حیاتی: اگر sw.js کش شود کاربر برای همیشه روی نسخهٔ قدیمی گیر می‌کند،
    # چون همان سرویس‌ورکرِ کهنه است که تصمیم می‌گیرد چه چیزی به‌روز شود.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # پوستهٔ اپ هم کش نمی‌شود: نام دارایی‌ها هش دارد و راهِ رسیدن به نسخهٔ
    # جدید، همین فایل است
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ── دارایی‌های هش‌دار ────────────────────────────────────────
    # نامشان با هر تغییر محتوا عوض می‌شود، پس کش یک‌سالهٔ تغییرناپذیر امن است
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── بقیه ─────────────────────────────────────────────────────
    # اپ تک‌صفحه‌ای است: هر مسیر ناشناخته باید به index.html برسد، وگرنه
    # رفرش‌کردن روی «/?admin» یا لینک اشتراکی ۴۰۴ می‌دهد
    location / {
        try_files $uri $uri/ /index.html;
    }

    # فایل‌های پنهان هرگز سرو نشوند
    location ~ /\. {
        deny all;
    }
}
