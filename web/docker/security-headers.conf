# سربرگ‌های امنیتی مشترک — نسخهٔ بازنویسی (web/).
#
# چرا فایل جداست: در nginx هر `add_header` داخل یک بلوک `location`،
# **همهٔ** سربرگ‌های ارث‌برده از بلوک بالاتر را دور می‌ریزد. پس هر location
# که Cache-Control خودش را می‌گذارد، باید این‌ها را هم دوباره include کند —
# وگرنه بی‌صدا بدون CSP سرو می‌شود.

add_header X-Content-Type-Options "nosniff"                         always;
add_header X-Frame-Options        "SAMEORIGIN"                      always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# سیاست امنیتی محتوا — از نسخهٔ اول سخت‌گیرانه‌تر، چون معماری عوض شده:
# سرویس‌های بیرونی (هواشناسی، مسیریابی، کشف) را حالا «بک‌اند» صدا می‌زند نه
# مرورگر، پس connect-src فقط 'self' است. مرورگر جز مبدأ خودش فقط کاشی نقشه
# می‌گیرد.
#   img-src data:  → نقش گره و آیکون‌های درون‌خطی
#   img-src tile.openstreetmap.org → کاشی‌های نقشه
#   style-src 'unsafe-inline' → استایل‌های درون‌خطی MUI/Emotion
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
